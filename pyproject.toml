[project]
name = "synology-poc"
version = "0.1.0"
description = "Proof of concept for the Synology File Station Web API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "mcp>=2.3",
]

[project.scripts]
synology-mcp = "synology_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synology_poc", "src/synology_mcp"]

[dependency-groups]
dev = [
    "cryptography>=44",
    "pytest>=9.1.1",
]
